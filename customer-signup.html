<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Customer Registration</title>

<link rel="stylesheet" href="customer.css">

</head>

<body>

<div class="container">

<div class="card signup-card">

<h1>Create Account</h1>

<form id="signupForm">

<label>First Name</label>

<input
type="text"
id="firstName"
required>

<label>Middle Name</label>

<input
type="text"
id="middleName">

<label>Last Name</label>

<input
type="text"
id="lastName"
required>

<label>National ID</label>

<input
type="number"
id="idNumber"
required>

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="07XXXXXXXX"
required>

<label>Email Address</label>

<input
type="email"
id="signupEmail"
required>

<label>Profile Picture</label>

<input
type="file"
id="profilePicture"
accept="image/*">

<img
id="preview"
class="preview"
src="#"
alt="Profile Preview">

<label>Create Password</label>

<input
type="password"
id="createPassword"
required>

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
required>

<div class="terms">

<input
type="checkbox"
id="terms"
required>

<label for="terms">

I accept the Terms and Conditions

</label>

</div>

<button
type="submit"
class="mainBtn">

Create Account

</button>

</form>

<p class="bottom">

Already have an account?

<a href="customer-login.html">

Login

</a>

</p>

</div>

</div>

<script src="customer.js"></script>

</body>

</html>
